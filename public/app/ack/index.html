<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>تأكيد استلام التنبيه — سِجل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app/public.css" />
  </head>
  <body>
    <main>
      <p class="brand" id="brand">سِجل</p>
      <h1 id="title">جارٍ تحميل التنبيه…</h1>

      <section class="panel" id="alert-box" hidden>
        <p class="meta" id="meta"></p>
        <p class="detail" id="details"></p>
        <p class="action" id="action"></p>
      </section>

      <form id="form" hidden>
        <label for="note">ماذا فعلت؟ (اختياري)</label>
        <input id="note" type="text" maxlength="300" autocomplete="off" />
        <button class="btn" id="submit" type="submit">استلمت التنبيه</button>
      </form>

      <p class="msg" id="msg" role="status" hidden></p>
    </main>

    <script>
      const token = new URLSearchParams(location.search).get("t") ?? "";
      const $ = (id) => document.getElementById(id);

      function message(text, ok) {
        $("msg").textContent = text;
        $("msg").className = `msg ${ok ? "msg--ok" : "msg--bad"}`;
        $("msg").hidden = false;
      }

      const time = (value) =>
        new Intl.DateTimeFormat("ar", { dateStyle: "medium", timeStyle: "short" }).format(new Date(value));

      async function load() {
        let data;
        try {
          const res = await fetch(`/api/control/ack-info?t=${encodeURIComponent(token)}`);
          data = await res.json();
        } catch {
          $("title").textContent = "تعذّر الاتصال";
          message("تحقّق من الشبكة ثم أعد فتح الرابط.", false);
          return;
        }
        if (!data.ok) {
          $("title").textContent = "الرابط غير صالح";
          message("افتح الرابط كما وصلك في رسالة واتساب.", false);
          return;
        }
        $("brand").textContent = `سِجل — ${data.branch}`;
        $("title").textContent = data.label;
        $("meta").textContent = `${data.location || "—"} · ${time(data.occurredAt)}`;
        $("details").textContent = data.details;
        $("details").hidden = !data.details;
        $("action").textContent = data.action;
        $("action").hidden = !data.action;
        $("alert-box").hidden = false;
        if (data.acked) {
          message(`استلمه ${data.ackByName || "أحد المستلمين"} ${data.ackAt ? time(data.ackAt) : ""}`, true);
        } else {
          $("form").hidden = false;
        }
      }

      $("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("submit").disabled = true;
        try {
          const res = await fetch("/api/control/ack", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ t: token, note: $("note").value }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);
          $("form").hidden = true;
          message(data.already ? "سبق تأكيد استلام هذا التنبيه." : "سُجّل استلامك وتوقف التصعيد.", true);
        } catch (error) {
          $("submit").disabled = false;
          message(error.message || "تعذّر التأكيد، حاول مرة أخرى.", false);
        }
      });

      load();
    </script>
  </body>
</html>
