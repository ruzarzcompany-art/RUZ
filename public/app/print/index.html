<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>سِجل — طباعة مستند</title>
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body class="body--print">
    <div class="print-toolbar no-print">
      <button id="print-now" class="btn btn--primary btn--sm" type="button">طباعة / حفظ PDF</button>
      <button id="print-back" class="btn btn--ghost btn--sm" type="button">رجوع</button>
      <label class="print-toolbar__field">
        <span>مقاس الورق</span>
        <select id="print-paper"></select>
      </label>
      <label class="print-toolbar__field">
        <span>الاتجاه</span>
        <select id="print-orientation">
          <option value="portrait">عمودي</option>
          <option value="landscape">أفقي</option>
        </select>
      </label>
      <span id="print-note" class="hint"></span>
      <span id="print-app-hint" class="hint" hidden>
        إن لم تفتح نافذة الطباعة داخل التطبيق المُثبَّت، افتح النظام من متصفح
        الجهاز وسجّل الدخول ثم اطبع من هناك.
      </span>
    </div>

    <article id="doc" class="sheet">
      <p class="empty">جارٍ تحميل المستند…</p>
    </article>

    <!--
      لاحقة `?v=` مقصودة: النسخة القديمة من عامل الخدمة كانت تخدم ملفات
      الواجهة من ذاكرتها دون أي تحديث، فتبقى صفحة الطباعة على كودها القديم
      بعد كل نشر. الرابط الموسوم بالإصدار لا يوجد في تلك الذاكرة فيُحمَّل من
      الشبكة، فيصل الإصلاح إلى الأجهزة من أول محاولة طباعة. عامل الخدمة
      الجديد (الشبكة أولاً) لا يحتاجها، فبقاؤها احتياط لا شرط.
    -->
    <script src="/app/print/print.js?v=v7" type="module"></script>
  </body>
</html>
